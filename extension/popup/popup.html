<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LaTeX for Google Docs</title>

  <link rel="stylesheet" href="popup.css">

</head>

<body>

  <header>

    <h1>LaTeX for Google Docs</h1>

    <p class="subtitle">Side panel equation editor for desktop Google Docs</p>

  </header>



  <section class="shortcuts">

    <h2>Shortcuts</h2>

    <ul>

      <li><kbd>Alt</kbd>+<kbd>=</kbd> Open equation editor</li>

      <li><kbd>Alt</kbd>+<kbd>Enter</kbd> Insert into document (in panel)</li>

      <li><kbd>F2</kbd> Edit equation near cursor</li>

      <li><kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>M</kbd> Fallback open editor</li>

    </ul>

  </section>



  <section class="actions">

    <button id="btn-open-panel" type="button">Open Equation Editor</button>

    <a id="link-options" href="#">Settings</a>

  </section>



  <section class="status">

    <p id="status-text">Open a Google Doc to begin.</p>

  </section>



  <footer>

    <a href="https://accessuci.ics.uci.edu/digimath/" target="_blank" rel="noopener">Access Digi Math</a>

  </footer>



  <script src="popup.js"></script>

</body>

</html>
